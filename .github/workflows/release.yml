name: Release

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            os_name: macos
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            os_name: macos
          # Windows
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
            rust_targets: ''
            os_name: windows
          - platform: windows-latest
            args: --target aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            os_name: windows
          # Linux (deb + AppImage only)
          - platform: ubuntu-22.04
            args: '--bundles deb appimage'
            rust_targets: ''
            os_name: linux
          - platform: ubuntu-22.04-arm
            args: '--bundles deb appimage'
            rust_targets: ''
            os_name: linux

    runs-on: ${{ matrix.platform }}
    environment: APPLE_CERTIFICATE

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfontconfig1-dev xdg-utils

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}

      - name: Rename and upload artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          OS="${{ matrix.os_name }}"
          ARTIFACTS='${{ steps.build.outputs.artifactPaths }}'
          echo "$ARTIFACTS" | jq -r '.[]' | tr -d '\r' | while read -r path; do
            [ -f "$path" ] || continue
            filename=$(basename "$path")
            new_name=$(echo "$filename" | sed "s/_/-${OS}_/")
            cp "$path" "/tmp/${new_name}"
            gh release upload "$TAG" "/tmp/${new_name}" --clobber
          done

  build-rpm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
          - runner: ubuntu-22.04-arm

    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:40

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf group install -y "C Development Tools and Libraries"
          dnf install -y \
            webkit2gtk4.1-devel openssl-devel libappindicator-gtk3-devel \
            librsvg2-devel patchelf fontconfig-devel \
            nodejs npm curl file pkg-config git

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install pnpm and build
        run: |
          npm install -g pnpm
          pnpm install
          pnpm tauri build --bundles rpm

      - name: Upload RPM to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
          REPO: ${{ github.repository }}
        run: |
          for rpm in src-tauri/target/release/bundle/rpm/*.rpm; do
            [ -f "$rpm" ] || continue
            filename=$(basename "$rpm")
            new_name=$(echo "$filename" | sed "s/-/-fedora-/")
            curl -sSL -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${rpm}" \
              "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${new_name}"
          done
