[package]
name = "pidanmd"
version = "0.2.0"
description = "A beautiful Markdown editor"
authors = ["finchxu"]
license = "MIT"
edition = "2021"

[lib]
name = "pidanmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pidanmd"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
font-kit = "0.14"
thiserror = "2"
